<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="./assets/css/swiper-bundle.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <style>
    .page-title {
      margin-left: 5%;
      position: absolute;
      width: 25vw;
      height: 6vw;
      top: 15%;
      left: 50%;
      text-align: center;
      z-index: 10000;
      background-color: #ffea71;
      transition: opacity 3s ease;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 0.3vw solid white;
      border-radius: 1vw;
      box-shadow: 0vw 0.4vw 0.2vw rgba(59, 59, 59, 0.421);
    }

    .page-title span {
      font-size: 3vw;
      text-align: center;
      -webkit-text-stroke: 0.1vw transparent;
      color: #ff2050;
      display: block;
      font-weight: bolder !important;
    }

    body {
      background-image: url("./assets/images/bg-image.png");
    }
  </style>
  <body>
    <!-- Sound effects -->
    <audio id="topicAudio" src="./assets/audio/topic.mp3" preload="auto"></audio>
    <audio id="swiperAudio" src="./assets/audio/swiper.mp3" preload="auto"></audio>
    <audio id="popAudio" src="./assets/audio/pop.mp3" preload="auto"></audio>

    <a class="home-btn" href="index.html">
      <img src="./assets/images/home-btn.png" alt="" />
    </a>
    <!-- nav-container -->
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <main>
      <div class="left-container">
        <div class="page-title">
          <span data-lang-key="title"> </span>
        </div>

        <div class="swiper video-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <video muted playsinline preload="metadata">
                <source src="./assets/videos/7.mp4" type="video/mp4" />
              </video>
            </div>
            <div class="swiper-slide">
              <video muted playsinline preload="metadata">
                <source src="./assets/videos/8.mp4" type="video/mp4" />
              </video>
            </div>
            <div class="swiper-slide">
              <video muted playsinline preload="metadata">
                <source src="./assets/videos/9.mp4" type="video/mp4" />
              </video>
            </div>

          </div>
        </div>

         <div class="custom-nav">
          <button class="swiper-ctrl-prev disabled">
            <img src="./assets/images/prev-btn.png" alt="" />
          </button>

          <button class="swiper-ctrl-next">
            <img src="./assets/images/next-btn.png" alt="" />
          </button>
        </div>

        <!-- Dot pagination for the video/text swipers -->
        <div class="video-pagination"></div>
      </div>
      <div class="right-container">
        <div class="pages">
          <a class="page page-1" href="topic-1.html" data-lang-key="num-1"></a>
          <a class="page page-2" href="topic-2.html" data-lang-key="num-2"></a>
          <a class="page page-3 active" href="topic-3.html" data-lang-key="num-3"></a>
          <a class="page page-4" href="topic-4.html" data-lang-key="num-4"></a>
          <a class="page page-5" href="topic-5.html" data-lang-key="num-5"></a>
          <a class="page page-6" href="topic-6.html" data-lang-key="num-6"></a>
        </div>
        <div class="swiper text-swiper">
          <div class="swiper-title">
            <img src="./assets/images/3.png" alt="" />
            <span class="num" data-lang-key="num-3"></span>
            <span class="topic-text" data-lang-key="title-3"></span>
          </div>
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="slide-text" data-lang-key="slide-3.1"></div>
            </div>
            <div class="swiper-slide">
              <div class="slide-text" data-lang-key="slide-3.2"></div>
            </div>
            <div class="swiper-slide">
              <div class="slide-text" data-lang-key="slide-3.3"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./assets/js/app.js"></script>
    <!-- Add these script files before closing </body> -->
       <script src="./assets/js/swiper-bundle.min.js"></script>
 <script src="./assets/js/djp.js"></script>
    <script>
      const prevBtn = document.querySelector(".swiper-ctrl-prev");
      const nextBtn = document.querySelector(".swiper-ctrl-next");
      const paginationContainer = document.querySelector(".video-pagination");

      // ---- Sound effect setup ----
      const topicAudio = document.getElementById("topicAudio");
      const swiperAudio = document.getElementById("swiperAudio");
      const popAudio = document.getElementById("popAudio");

      function playSound(audio) {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // Play swiper.mp3 whenever the prev/next swiper nav buttons are used
      if (prevBtn) {
        prevBtn.addEventListener("click", () => playSound(swiperAudio));
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", () => playSound(swiperAudio));
      }

      // Play pop.mp3 when the home button is clicked (small delay so the sound can start before navigating away)
      const homeBtn = document.querySelector(".home-btn");
      if (homeBtn) {
        homeBtn.addEventListener("click", (e) => {
          e.preventDefault();
          playSound(popAudio);
          const href = homeBtn.getAttribute("href");
          setTimeout(() => {
            window.location.href = href;
          }, 200);
        });
      }

      // Play topic.mp3 when a topic page link is clicked (small delay so the sound can start before navigating away)
      document.querySelectorAll(".pages .page").forEach((pageLink) => {
        pageLink.addEventListener("click", (e) => {
          e.preventDefault();
          playSound(topicAudio);
          const href = pageLink.getAttribute("href");
          setTimeout(() => {
            window.location.href = href;
          }, 200);
        });
      });

      const textSwiper = new Swiper(".text-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
        speed: 700,
      });

      const videoSwiper = new Swiper(".video-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        speed: 700,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
      });

      function pauseAllVideos() {
        document.querySelectorAll(".video-swiper video").forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
      }

      function playActiveVideo() {
        const activeSlide = document.querySelector(
          ".video-swiper .swiper-slide-active video",
        );
        if (activeSlide) {
          activeSlide.play().catch(() => {});
        }
      }

      // Disabled (dimmed, non-clickable) instead of fully hidden on first/last slide
      function updateNav() {
        const isFirst = videoSwiper.activeIndex === 0;
        const isLast =
          videoSwiper.activeIndex === videoSwiper.slides.length - 1;

        prevBtn.classList.toggle("disabled", isFirst);
        nextBtn.classList.toggle("disabled", isLast);
      }

      // Build the dot pagination once, based on how many slides exist
      function buildPagination() {
        paginationContainer.innerHTML = "";
        const totalSlides = videoSwiper.slides.length;

        for (let i = 0; i < totalSlides; i++) {
          const dot = document.createElement("div");
          dot.classList.add("dot");
          if (i === 0) dot.classList.add("active");
          dot.addEventListener("click", () => {
            playSound(swiperAudio);
            syncSwipers(i);
          });
          paginationContainer.appendChild(dot);
        }
      }

      function updatePagination() {
        const dots = paginationContainer.querySelectorAll(".dot");
        dots.forEach((dot, i) => {
          dot.classList.toggle("active", i === videoSwiper.activeIndex);
        });
      }

      function syncSwipers(index) {
        videoSwiper.slideTo(index);
        textSwiper.slideTo(index);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
        updatePagination();
      }

      nextBtn.addEventListener("click", () => {
        if (
          !nextBtn.classList.contains("disabled") &&
          videoSwiper.activeIndex < videoSwiper.slides.length - 1
        ) {
          syncSwipers(videoSwiper.activeIndex + 1);
        }
      });

      prevBtn.addEventListener("click", () => {
        if (
          !prevBtn.classList.contains("disabled") &&
          videoSwiper.activeIndex > 0
        ) {
          syncSwipers(videoSwiper.activeIndex - 1);
        }
      });

      videoSwiper.on("slideChange", function () {
        textSwiper.slideTo(videoSwiper.activeIndex);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
        updatePagination();
      });

      textSwiper.on("slideChange", function () {
        if (videoSwiper.activeIndex !== textSwiper.activeIndex) {
          videoSwiper.slideTo(textSwiper.activeIndex);
          pauseAllVideos();
          playActiveVideo();
          updateNav();
          updatePagination();
        }
      });

      buildPagination();
      updateNav();
      updatePagination();
      playActiveVideo();
    </script>
  </body>
</html>
