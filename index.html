<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <style>
    .page-title {
      position: absolute;
      width: 50vw;
      height: 12vw;
      top: 50%;
      left: 50%;
      text-align: center;
      z-index: 10000;
      background-color: #ffea71;
      transition: opacity 3s ease;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border: 0.3vw solid white;
      border-radius: 2vw;
      box-shadow: 0vw 0.4vw 0.2vw rgba(59, 59, 59, 0.421);
    }

    .page-title span {
      font-size: 6vw;
      text-align: center;
      -webkit-text-stroke: 0.1vw transparent;
      color: #ff2050;
      display: block;
      font-weight: bolder !important;
    }

    body {
      background-image: url("./assets/images/bg-image.png");
    }
  </style>
  <body>
    <div class="page-title">
      <span data-lang-key="title"></span>
    </div>
    <a href="be-truthful.html" class="click" data-lang-key="click"></a>
    <!-- nav-container -->
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
