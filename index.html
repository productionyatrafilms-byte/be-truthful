<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <style>
    .page-title {
      position: absolute;
      width: 55vw;
      height: 30vw;
      top: 40%;
      left: 50%;
      text-align: center;
      z-index: 10000;
      transition: top 0.8s ease, opacity 3s ease;
      transform: translate(-50%, -50%);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 2vw;
      background-image: url("./assets/images/page-title.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .page-title span {
      margin-top: 9vw;
      font-size: 6vw;
      text-align: center;
      -webkit-text-stroke: 0.1vw transparent;
      color: #ff2050;
      display: block;
      font-weight: bolder !important;
    }

    .topics {
      transition: bottom 0.8s ease;
    }

    .click {
      transition: opacity 0.4s ease;
    }

    body {
      background-image: url("./assets/images/bg-image.png");
      overflow: hidden;
    }
  </style>
  <body>
    <div class="page-title">
      <span data-lang-key="title"></span>
    </div>
    <div class="click" data-lang-key="click"></div>
    <!-- nav-container -->
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <div class="topics">
      <a href="topic-1.html" class="topic topic-1">
        <img src="./assets/images/1.png" alt="" />
        <span class="num" data-lang-key="num-1"></span>
        <span class="topic-text" data-lang-key="title-1"></span>
      </a>
      <a href="topic-2.html" class="topic topic-2">
        <img src="./assets/images/2.png" alt="" />
        <span class="num" data-lang-key="num-2"></span>
        <span class="topic-text" data-lang-key="title-2"></span>
      </a>
      <a href="topic-3.html" class="topic topic-3">
        <img src="./assets/images/3.png" alt="" />
        <span class="num" data-lang-key="num-3"></span>
        <span class="topic-text" data-lang-key="title-3"></span>
      </a>
      <a href="topic-4.html" class="topic topic-4">
        <img src="./assets/images/4.png" alt="" />
        <span class="num" data-lang-key="num-4"></span>
        <span class="topic-text" data-lang-key="title-4"></span>
      </a>
      <a href="topic-5.html" class="topic topic-5">
        <img src="./assets/images/5.png" alt="" />
        <span class="num" data-lang-key="num-5"></span>
        <span class="topic-text" data-lang-key="title-5"></span>
      </a>
      <a href="topic-6.html" class="topic topic-6">
        <img src="./assets/images/6.png" alt="" />
        <span class="num" data-lang-key="num-6"></span>
        <span class="topic-text" data-lang-key="title-6"></span>
      </a>
    </div>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/djp.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const clickBtn = document.querySelector(".click");
        const pageTitle = document.querySelector(".page-title");
        const topics = document.querySelector(".topics");
        const topicLinks = document.querySelectorAll(".topic");

        // audio for click button and topic links
        const clickAudio = new Audio("./assets/audio/click.mp3");
        const topicAudio = new Audio("./assets/audio/topic.mp3");

        function playSound(audio) {
          audio.currentTime = 0;
          audio.play().catch((err) => {
            console.error("Error playing audio:", err);
          });
        }

        if (clickBtn && pageTitle && topics) {
          clickBtn.addEventListener("click", () => {
            playSound(clickAudio);

            // hide the click button
            clickBtn.classList.add("hidden");

            // move page-title up and reveal topics
            pageTitle.style.top = "25%";
            topics.style.bottom = "0";
          });
        }

        topicLinks.forEach((topic) => {
          topic.addEventListener("click", (e) => {
            e.preventDefault();

            playSound(topicAudio);

            const href = topic.getAttribute("href");

            setTimeout(() => {
              window.location.href = href;
            }, 200);
          });
        });
      });
    </script>
  </body>
</html>
