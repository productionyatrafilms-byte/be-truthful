<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="./assets/css/swiper-bundle.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      .page-title {
        margin-left: 5%;
        position: absolute;
        width: 25vw;
        height: 6vw;
        top: 15%;
        left: 50%;
        text-align: center;
        z-index: 10000;
        background-color: #ffea71;
        transition: opacity 3s ease;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 0.3vw solid white;
        border-radius: 1vw;
        box-shadow: 0vw 0.4vw 0.2vw rgba(59, 59, 59, 0.421);
      }

      .page-title span {
        font-size: 3vw;
        text-align: center;
        -webkit-text-stroke: 0.1vw transparent;
        color: #ff2050;
        display: block;
        font-weight: bolder !important;
      }

      body {
        background-image: url("./assets/images/bg-image.png");
      }

      /* ---------------------------------------------------------- */
      /* Video button + popup player (same pattern as index.html)   */
      /* ---------------------------------------------------------- */
      .page-content {
        width: 100%;
        height: 100%;
        transition:
          filter 0.4s ease,
          transform 0.4s ease;
      }

      body.video-open .page-content {
        filter: blur(0.45vw);
        pointer-events: none;
        user-select: none;
      }

      .video-btn {
        position: fixed;
        bottom:1vw;
        left: 10vw;
        transform: translateX(-50%);
        z-index: 1000;
      }

      .start-video-btn {
        border: none;
        background-color: transparent;
        background-image: url("./assets/images/watch.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        width: 12vw;
        height: 4.3vw;
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          box-shadow 0.25s ease;
      }


      .start-video-btn:active {
        transform: scale(0.98);
      }

      .close-video-btn i,
      .video-center-play i,
      .control-btn i {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        flex: 0 0 auto;
      }

      .close-video-btn i {
        width: 1.8vw;
        min-width: 1.8vw;
        max-width: 1.8vw;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        max-width: 2.2vw;
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        max-width: 1.4vw;
      }

      .start-text {
        font-size: 1.5vw;
        font-weight: 900;
        letter-spacing: 0.1vw;
        color: #ffffff;
        line-height: 1;
        font-family: "PassionOneRegular";
        text-align: end;
        width: 100%;
        padding-right: 01vw;
      }
      body[data-lang="hi"] .start-text {
        font-size: 1.3vw !important;
      }

      body[data-lang="gu"] .start-text {
        font-size: 1.3vw !important;
      }

      .video-popup {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.38);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .video-popup.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .video-box {
        position: relative;
        width: 68vw;
        aspect-ratio: 16 / 9;
        border-radius: 2vw;
        background: #faa12c56;
        padding: 0.75vw;
        border: 0.25vw solid white;
        box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.45);
        transform: scale(0.82);
        opacity: 0;
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
        backdrop-filter: blur(0.5vw);
        -webkit-backdrop-filter: blur(0.5vw);
      }

      .video-popup.active .video-box {
        transform: scale(1);
        opacity: 1;
      }

      .popup-video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 1.4vw;
        overflow: hidden;
        background: #000;
        border: 0.18vw solid #a60b0b;
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      .close-video-btn {
        position: absolute;
        top: -1.35vw;
        right: -1.35vw;
        width: 3.4vw;
        height: 3.4vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        color: #a60b0b;
        font-size: 1.8vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0.35vw 1vw rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          background 0.25s ease,
          color 0.25s ease;
      }

      .close-video-btn:hover {
        transform: rotate(90deg) scale(1.08);
        background: #a60b0b;
        color: #ffffff;
      }

      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(166, 11, 11, 0.96),
          rgba(229, 141, 42, 0.62),
          rgba(229, 141, 42, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .popup-video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
      }

      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        pointer-events: auto;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: -70vw 0 0 69.6vw #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: #ffffff;
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        max-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn:hover {
        background: #ffffff;
        color: #a60b0b;
        transform: scale(1.08);
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
      }

      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        max-width: 6vw;
        height: 6vw;
        border: 0.22vw solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: rgba(166, 11, 11, 0.5);
        color: #ffffff;
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(229, 141, 42, 0.82);
        transform: translate(-50%, -50%) scale(1.08);
      }

      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        padding: 0;
        background: #000;
      }

      .video-box:fullscreen .popup-video-frame {
        border-radius: 0;
        border: none;
      }

      .video-box:fullscreen .close-video-btn {
        top: 1.5vw;
        right: 1.5vw;
      }
    </style>
  </head>

  <body>
    <!-- Sound effects -->
    <audio id="topicAudio" src="./assets/audio/topic.mp3" preload="auto"></audio>
    <audio id="swiperAudio" src="./assets/audio/swiper.mp3" preload="auto"></audio>
    <audio id="popAudio" src="./assets/audio/pop.mp3" preload="auto"></audio>

    <div class="page-content">
      <a class="home-btn" href="index.html">
        <img src="./assets/images/home-btn.png" alt="" />
      </a>

      <div class="video-btn">
        <button class="start-video-btn" type="button">
          <span class="start-text" data-lang-key="watch">START</span>
        </button>
      </div>

      <!-- nav-container -->
      <div class="language-container">
        <div class="english active">E</div>
        <div class="hindi">H</div>
        <div class="gujrati">G</div>
      </div>
      <main>
        <div class="left-container">
          <div class="page-title">
            <span data-lang-key="title"> </span>
          </div>

          <div class="swiper video-swiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <video muted playsinline preload="metadata">
                  <source src="./assets/videos/1.mp4" type="video/mp4" />
                </video>
              </div>
            </div>
          </div>

          
          <!-- Dot pagination for the video/text swipers -->
          <div class="video-pagination"></div>
        </div>
        <div class="right-container">
          <div class="pages">
            <a class="page page-1 active" href="topic-1.html" data-lang-key="num-1"></a>
            <a class="page page-2" href="topic-2.html" data-lang-key="num-2"></a>
            <a class="page page-3" href="topic-3.html" data-lang-key="num-3"></a>
            <a class="page page-4" href="topic-4.html" data-lang-key="num-4"></a>
            <a class="page page-5" href="topic-5.html" data-lang-key="num-5"></a>
            <a class="page page-6" href="topic-6.html" data-lang-key="num-6"></a>
          </div>
          <div class="swiper text-swiper">
            <div class="swiper-title">
              <img src="./assets/images/1.png" alt="" />

              <span class="topic-text" data-lang-key="title-1"></span>

      </main>
    </div>

    <div class="video-popup">
      <div class="video-box">
        <button class="close-video-btn" type="button">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="popup-video-frame">
          <video
            class="popup-video"
            src="./assets/videos/video.mp4"
            preload="metadata"
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
          ></video>

          <button class="video-center-play" type="button">
            <i class="fa-solid fa-play"></i>
          </button>

          <div class="custom-controls">
            <div class="progress-wrap">
              <input
                class="video-progress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
              />
            </div>

            <div class="control-row">
              <div class="control-left">
                <button class="control-btn play-pause-btn" type="button">
                  <i class="fa-solid fa-play"></i>
                </button>

                <div class="time-text">
                  <span class="current-time">0:00</span>
                  /
                  <span class="total-time">0:00</span>
                </div>
              </div>

              <div class="control-right">
                <button class="control-btn mute-btn" type="button">
                  <i class="fa-solid fa-volume-high"></i>
                </button>

                <input
                  class="volume-range"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1"
                />

                <button class="control-btn fullscreen-btn" type="button">
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

    <script src="./assets/js/app.js"></script>

    <script src="./assets/js/swiper-bundle.min.js"></script>

    <script>
      const prevBtn = document.querySelector(".swiper-ctrl-prev");
      const nextBtn = document.querySelector(".swiper-ctrl-next");
      const paginationContainer = document.querySelector(".video-pagination");

      // ---- Sound effect setup ----
      const topicAudio = document.getElementById("topicAudio");
      const swiperAudio = document.getElementById("swiperAudio");
      const popAudio = document.getElementById("popAudio");

      function playSound(audio) {
        if (!audio) return;
        audio.currentTime = 0;
        audio.play().catch(() => {});
      }

      // Play swiper.mp3 whenever the prev/next swiper nav buttons are used
      if (prevBtn) {
        prevBtn.addEventListener("click", () => playSound(swiperAudio));
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", () => playSound(swiperAudio));
      }

      // Play pop.mp3 when the home button is clicked (small delay so the sound can start before navigating away)
      const homeBtn = document.querySelector(".home-btn");
      if (homeBtn) {
        homeBtn.addEventListener("click", (e) => {
          e.preventDefault();
          playSound(popAudio);
          const href = homeBtn.getAttribute("href");
          setTimeout(() => {
            window.location.href = href;
          }, 200);
        });
      }

      // Play topic.mp3 when a topic page link is clicked (small delay so the sound can start before navigating away)
      document.querySelectorAll(".pages .page").forEach((pageLink) => {
        pageLink.addEventListener("click", (e) => {
          e.preventDefault();
          playSound(topicAudio);
          const href = pageLink.getAttribute("href");
          setTimeout(() => {
            window.location.href = href;
          }, 200);
        });
      });

      const textSwiper = new Swiper(".text-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
        speed: 700,
      });

      const videoSwiper = new Swiper(".video-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        speed: 700,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
      });

      function pauseAllVideos() {
        document.querySelectorAll(".video-swiper video").forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
      }

      function playActiveVideo() {
        const activeSlide = document.querySelector(
          ".video-swiper .swiper-slide-active video",
        );
        if (activeSlide) {
          activeSlide.play().catch(() => {});
        }
      }

      // Disabled (dimmed, non-clickable) instead of fully hidden on first/last slide
      function updateNav() {
        const isFirst = videoSwiper.activeIndex === 0;
        const isLast =
          videoSwiper.activeIndex === videoSwiper.slides.length - 1;

        prevBtn.classList.toggle("disabled", isFirst);
        nextBtn.classList.toggle("disabled", isLast);
      }

      // Build the dot pagination once, based on how many slides exist
      function buildPagination() {
        paginationContainer.innerHTML = "";
        const totalSlides = videoSwiper.slides.length;

        for (let i = 0; i < totalSlides; i++) {
          const dot = document.createElement("div");
          dot.classList.add("dot");
          if (i === 0) dot.classList.add("active");
          dot.addEventListener("click", () => {
            playSound(swiperAudio);
            syncSwipers(i);
          });
          paginationContainer.appendChild(dot);
        }
      }

      function updatePagination() {
        const dots = paginationContainer.querySelectorAll(".dot");
        dots.forEach((dot, i) => {
          dot.classList.toggle("active", i === videoSwiper.activeIndex);
        });
      }

      function syncSwipers(index) {
        videoSwiper.slideTo(index);
        textSwiper.slideTo(index);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
        updatePagination();
      }

      nextBtn.addEventListener("click", () => {
        if (
          !nextBtn.classList.contains("disabled") &&
          videoSwiper.activeIndex < videoSwiper.slides.length - 1
        ) {
          syncSwipers(videoSwiper.activeIndex + 1);
        }
      });

      prevBtn.addEventListener("click", () => {
        if (
          !prevBtn.classList.contains("disabled") &&
          videoSwiper.activeIndex > 0
        ) {
          syncSwipers(videoSwiper.activeIndex - 1);
        }
      });

      videoSwiper.on("slideChange", function () {
        textSwiper.slideTo(videoSwiper.activeIndex);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
        updatePagination();
      });

      textSwiper.on("slideChange", function () {
        if (videoSwiper.activeIndex !== textSwiper.activeIndex) {
          videoSwiper.slideTo(textSwiper.activeIndex);
          pauseAllVideos();
          playActiveVideo();
          updateNav();
          updatePagination();
        }
      });

      buildPagination();
      updateNav();
      updatePagination();
      playActiveVideo();
    </script>

    <script>
      window.addEventListener("load", function () {
        document.body.classList.add("page-loaded");
      });

      // click sound effect for the video start button
      const videoPlayClickSound = new Audio("./assets/audio/5.mp3");

      function playClickSound(audio) {
        audio.currentTime = 0;
        audio.play().catch(function (err) {
          console.error("Error playing click sound:", err);
        });
      }

      const startVideoBtn = document.querySelector(".start-video-btn");
      const videoPopup = document.querySelector(".video-popup");
      const videoBox = document.querySelector(".video-box");
      const closeVideoBtn = document.querySelector(".close-video-btn");
      const popupVideo = document.querySelector(".popup-video");
      const popupVideoFrame = document.querySelector(".popup-video-frame");

      const centerPlayBtn = document.querySelector(".video-center-play");
      const playPauseBtn = document.querySelector(".play-pause-btn");
      const playPauseIcon = playPauseBtn.querySelector("i");
      const centerPlayIcon = centerPlayBtn.querySelector("i");

      const videoProgress = document.querySelector(".video-progress");
      const currentTimeText = document.querySelector(".current-time");
      const totalTimeText = document.querySelector(".total-time");

      const muteBtn = document.querySelector(".mute-btn");
      const muteIcon = muteBtn.querySelector("i");
      const volumeRange = document.querySelector(".volume-range");

      const fullscreenBtn = document.querySelector(".fullscreen-btn");
      const fullscreenIcon = fullscreenBtn.querySelector("i");

      let controlsTimer;
      let lastVolume = 1;
      let savedVideoTime = 0;
      let isProgressDragging = false;

      function formatTime(time) {
        if (!time || isNaN(time)) return "0:00";

        const minutes = Math.floor(time / 60);
        const seconds = Math.floor(time % 60);

        return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
      }

      function updatePlayIcons() {
        if (popupVideo.paused) {
          playPauseIcon.className = "fa-solid fa-play";
          centerPlayIcon.className = "fa-solid fa-play";
          centerPlayBtn.classList.remove("hide");
        } else {
          playPauseIcon.className = "fa-solid fa-pause";
          centerPlayIcon.className = "fa-solid fa-pause";
          centerPlayBtn.classList.add("hide");
        }
      }

      function updateProgress() {
        if (!popupVideo.duration) return;

        savedVideoTime = popupVideo.currentTime;

        if (!isProgressDragging) {
          const progressValue =
            (popupVideo.currentTime / popupVideo.duration) * 100;

          videoProgress.value = progressValue;
        }

        currentTimeText.textContent = formatTime(popupVideo.currentTime);
        totalTimeText.textContent = formatTime(popupVideo.duration);
      }

      // Free scrubbing while dragging the slider — just preview the target time
      function handleProgressInput() {
        if (!popupVideo.duration) return;

        isProgressDragging = true;

        const selectedTime =
          (Number(videoProgress.value) / 100) * popupVideo.duration;

        currentTimeText.textContent = formatTime(selectedTime);
      }

      // Free forward/backward seeking — jump to wherever the user drops the slider
      function handleProgressChange() {
        if (!popupVideo.duration) return;

        const selectedTime =
          (Number(videoProgress.value) / 100) * popupVideo.duration;

        popupVideo.currentTime = selectedTime;
        savedVideoTime = selectedTime;

        isProgressDragging = false;
        updateProgress();
      }

      function updateMuteIcon() {
        if (popupVideo.muted || popupVideo.volume === 0) {
          muteIcon.className = "fa-solid fa-volume-xmark";
        } else if (popupVideo.volume < 0.5) {
          muteIcon.className = "fa-solid fa-volume-low";
        } else {
          muteIcon.className = "fa-solid fa-volume-high";
        }
      }

      function togglePlay() {
        if (!popupVideo) return;

        if (popupVideo.paused) {
          popupVideo.play().catch(function () {});
        } else {
          popupVideo.pause();
        }
      }

      function openVideoPopup() {
        if (!videoPopup || !popupVideo) return;

        document.body.classList.add("video-open");
        videoPopup.classList.add("active");

        popupVideo.volume = Number(volumeRange.value);
        popupVideo.muted = false;

        if (savedVideoTime > 0) {
          popupVideo.currentTime = savedVideoTime;
        }

        updateMuteIcon();
        updatePlayIcons();
        updateProgress();

        setTimeout(function () {
          popupVideo.play().catch(function () {});
        }, 250);
      }

      function closeVideoPopup() {
        if (!videoPopup || !popupVideo) return;

        savedVideoTime = popupVideo.currentTime;

        popupVideo.pause();

        videoPopup.classList.remove("active");
        document.body.classList.remove("video-open");

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function () {});
        }

        updatePlayIcons();
      }

      function toggleMute() {
        if (popupVideo.muted || popupVideo.volume === 0) {
          popupVideo.muted = false;
          popupVideo.volume = lastVolume || 1;
          volumeRange.value = popupVideo.volume;
        } else {
          lastVolume = popupVideo.volume;
          popupVideo.muted = true;
          volumeRange.value = 0;
        }

        updateMuteIcon();
      }

      function changeVolume() {
        const volumeValue = Number(volumeRange.value);

        popupVideo.volume = volumeValue;
        popupVideo.muted = volumeValue === 0;

        if (volumeValue > 0) {
          lastVolume = volumeValue;
        }

        updateMuteIcon();
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          videoBox.requestFullscreen().catch(function () {});
        } else {
          document.exitFullscreen().catch(function () {});
        }
      }

      function updateFullscreenIcon() {
        if (document.fullscreenElement) {
          fullscreenIcon.className = "fa-solid fa-compress";
        } else {
          fullscreenIcon.className = "fa-solid fa-expand";
        }
      }

      function showControlsTemporarily() {
        popupVideoFrame.classList.remove("controls-hidden");

        clearTimeout(controlsTimer);

        if (!popupVideo.paused) {
          controlsTimer = setTimeout(function () {
            popupVideoFrame.classList.add("controls-hidden");
          }, 2200);
        }
      }

      if (startVideoBtn) {
        startVideoBtn.addEventListener("click", function () {
          playClickSound(videoPlayClickSound);
          openVideoPopup();
        });
      }

      if (closeVideoBtn) {
        closeVideoBtn.addEventListener("click", closeVideoPopup);
      }

      if (videoPopup) {
        videoPopup.addEventListener("click", function (e) {
          if (e.target === videoPopup) {
            closeVideoPopup();
          }
        });
      }

      if (popupVideo) {
        popupVideo.addEventListener("click", togglePlay);
        popupVideo.addEventListener("play", updatePlayIcons);
        popupVideo.addEventListener("pause", updatePlayIcons);
        popupVideo.addEventListener("timeupdate", updateProgress);
        popupVideo.addEventListener("loadedmetadata", updateProgress);

        popupVideo.addEventListener("ended", function () {
          savedVideoTime = 0;
          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";
          updatePlayIcons();
        });

        popupVideo.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });
      }

      if (videoProgress) {
        videoProgress.addEventListener("input", handleProgressInput);
        videoProgress.addEventListener("change", handleProgressChange);

        videoProgress.addEventListener("mousedown", function () {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("mouseup", handleProgressChange);

        videoProgress.addEventListener("touchstart", function () {
          isProgressDragging = true;
        });

        videoProgress.addEventListener("touchend", handleProgressChange);
      }

      if (centerPlayBtn) {
        centerPlayBtn.addEventListener("click", togglePlay);
      }

      if (playPauseBtn) {
        playPauseBtn.addEventListener("click", togglePlay);
      }

      if (muteBtn) {
        muteBtn.addEventListener("click", toggleMute);
      }

      if (volumeRange) {
        volumeRange.addEventListener("input", changeVolume);
      }

      if (fullscreenBtn) {
        fullscreenBtn.addEventListener("click", toggleFullscreen);
      }

      if (popupVideoFrame) {
        popupVideoFrame.addEventListener("mousemove", showControlsTemporarily);
        popupVideoFrame.addEventListener("click", showControlsTemporarily);
      }

      document.addEventListener("fullscreenchange", updateFullscreenIcon);

      document.addEventListener("keydown", function (e) {
        if (!videoPopup.classList.contains("active")) return;

        if (e.key === "Escape") {
          closeVideoPopup();
        }

        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        }

        if (e.key.toLowerCase() === "m") {
          toggleMute();
        }

        if (e.key.toLowerCase() === "f") {
          toggleFullscreen();
        }
      });
    </script>
  </body>
</html>
