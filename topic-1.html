<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title"></title>
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      .page-title {
        margin-left: 5%;
        position: absolute;
        width: 25vw;
        height: 6vw;
        top: 15%;
        left: 50%;
        text-align: center;
        z-index: 10000;
        background-color: #ffea71;
        transition: opacity 3s ease;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
        border: 0.3vw solid white;
        border-radius: 1vw;
        box-shadow: 0vw 0.4vw 0.2vw rgba(59, 59, 59, 0.421);
      }

      .page-title span {
        font-size: 3vw;
        text-align: center;
        -webkit-text-stroke: 0.1vw transparent;
        color: #ff2050;
        display: block;
        font-weight: bolder !important;
      }

      body {
        background-image: url("./assets/images/bg-image.png");
      }
    </style>
  </head>

  <body>
    <a class="home-btn" href="index.html">
      <img src="./assets/images/home-btn.png" alt="" />
    </a>
    <!-- nav-container -->
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujrati">G</div>
    </div>
    <main>
      <div class="left-container">
        <div class="page-title">
          <span data-lang-key="title"> </span>
        </div>

        <div class="swiper video-swiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <video muted playsinline preload="metadata">
                <source src="./assets/videos/1.mp4" type="video/mp4" />
              </video>
            </div>
          </div>
        </div>

        <div class="custom-nav">
          <button class="swiper-ctrl-prev hidden">
            <i class="fa-solid fa-chevron-left"></i>
          </button>

          <button class="swiper-ctrl-next">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>
      <div class="right-container">
        <div class="pages">
          <!-- <a class="page page-1" href="topic-1.html" data-lang-key="num-1"></a> -->
          <a class="page page-2" href="topic-2.html" data-lang-key="num-2"></a>
          <a class="page page-3" href="topic-3.html" data-lang-key="num-3"></a>
          <a class="page page-4" href="topic-4.html" data-lang-key="num-4"></a>
          <a class="page page-5" href="topic-5.html" data-lang-key="num-5"></a>
          <a class="page page-6" href="topic-6.html" data-lang-key="num-6"></a>
        </div>
        <div class="swiper text-swiper">
          <div class="swiper-title">
            <img src="./assets/images/1.png" alt="" />
            <span class="num" data-lang-key="num-1"></span>
            <span class="topic-text" data-lang-key="title-1"></span>
          </div>
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <div class="slide-text" data-lang-key="slide-1.1"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="./assets/js/app.js"></script>
    <!-- Add these script files before closing </body> -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      const prevBtn = document.querySelector(".swiper-ctrl-prev");
      const nextBtn = document.querySelector(".swiper-ctrl-next");

      const textSwiper = new Swiper(".text-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
        speed: 700,
      });

      const videoSwiper = new Swiper(".video-swiper", {
        slidesPerView: 1,
        allowTouchMove: false,
        speed: 700,
        effect: "fade",
        fadeEffect: {
          crossFade: true,
        },
      });

      function pauseAllVideos() {
        document.querySelectorAll(".video-swiper video").forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });
      }

      function playActiveVideo() {
        const activeSlide = document.querySelector(
          ".video-swiper .swiper-slide-active video",
        );
        if (activeSlide) {
          activeSlide.play().catch(() => {});
        }
      }

      function updateNav() {
        const isFirst = videoSwiper.activeIndex === 0;
        const isLast =
          videoSwiper.activeIndex === videoSwiper.slides.length - 1;

        prevBtn.classList.toggle("hidden", isFirst);
        nextBtn.classList.toggle("hidden", isLast);
      }

      function syncSwipers(index) {
        videoSwiper.slideTo(index);
        textSwiper.slideTo(index);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
      }

      nextBtn.addEventListener("click", () => {
        if (videoSwiper.activeIndex < videoSwiper.slides.length - 1) {
          syncSwipers(videoSwiper.activeIndex + 1);
        }
      });

      prevBtn.addEventListener("click", () => {
        if (videoSwiper.activeIndex > 0) {
          syncSwipers(videoSwiper.activeIndex - 1);
        }
      });

      videoSwiper.on("slideChange", function () {
        textSwiper.slideTo(videoSwiper.activeIndex);
        pauseAllVideos();
        playActiveVideo();
        updateNav();
      });

      textSwiper.on("slideChange", function () {
        if (videoSwiper.activeIndex !== textSwiper.activeIndex) {
          videoSwiper.slideTo(textSwiper.activeIndex);
          pauseAllVideos();
          playActiveVideo();
          updateNav();
        }
      });

      updateNav();
      playActiveVideo();
    </script>
  </body>
</html>
